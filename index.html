
<!DOCTYPE html>
<html>
<head>
    <title>Student Fee Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>ABC GROUP OF INSTITUTIONS<br><br>STUDENT FEE DETAILS</h2>

    <!-- total details -->
    <div class="dashboard">
        <div class="card">
            <h3>Total Students</h3>
            <p id="totalStudents">0</p>
        </div>
        <div class="card">
            <h3>Total Fees Collected</h3>
            <p id="totalFees">₹0</p>
        </div>
    </div>

    <!-- student add and details -->
    <div class="section">
        <h2>Add Student</h2>
        <input id="name" placeholder="Student Name">
        <input id="roll" placeholder="Roll Number">
        <input id="className" placeholder="Class">
        <input id="fathermother" placeholder="Father/Mother Name">
        <input id="fee" type="number" min="0" placeholder="Total Fees">
        <button onclick="addStudent()">Add Student</button>
    </div>


    <!-- student fee collection -->
    <div class="section">
        <h2>Collect Fees</h2>
        <select id="studentSelect"></select>
        <input id="amount" type="number" min="0.01" placeholder="Payment Amount">
        <button onclick="collectFees()">Collect Fees</button>
    </div>


    <!-- student list and search -->
    <div class="section">
        <h2>Student List</h2>
        <input id="search" placeholder="Search Student" oninput="showStudents()">

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No.</th>
                    <th>Class</th>
                    <th>Parent Name</th>
                    <th>Total Fee</th>
                    <th>Paid</th>
                    <th>Balance</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentList"></tbody>
        </table>
    </div>

    <!-- fee history and search -->
    <div class="section">
        <h2>Fee History</h2>
        <input id="historySearch" placeholder="Search Fee History" oninput="showHistory()">

        <table>
            <thead>
                <tr>
                    <th>Student</th>
                    <th>Amount</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="feeHistory"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
